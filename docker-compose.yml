services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lixspace-compro
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - lixspace-net

networks:
  lixspace-net:
    driver: bridge
